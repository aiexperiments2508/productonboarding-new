[pytest]
testpaths = tests

# The suite runs in parallel, one worker per core.
#
# It is around 840 tests and twelve minutes in one process, and about a
# hundred and thirty seconds of that is setup: thirty-one modules rebuild the
# schema and twenty-two reload the 5,225-event tape in an autouse fixture, so
# roughly 155ms is spent before each test runs. The rest is real work, which is
# why this is a distribution change rather than a fixture optimisation.
#
# `--dist loadfile` is load bearing and not a tuning choice. Every test in a
# module has to land on the same worker, because `tests/conftest.py` gives each
# *module* its own database, env file and catalog extension, and the modules
# drop and reseed those in autouse fixtures. Under the default `--dist load`
# two workers would take turns at one module's tests against one database file
# and each reseed would delete the other's fixtures mid-run - intermittently,
# and only in a full run.
#
# `-n auto` takes the core count. Override it for a single file, where eight
# workers is startup cost for one worker's worth of work:
#
#     pytest tests/test_onboarding.py -n0
#
# Two concurrent pytest *runs* still conflict, whatever this says: the modules
# share `data/`, and `test_kg_neo4j` shares whatever Neo4j `NEO4J_URI` names.
# One run at a time.
addopts = -n auto --dist loadfile
